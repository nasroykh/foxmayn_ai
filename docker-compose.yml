# Production stack. Copy .env.example to .env, replace every CHANGE_ME, then:
#   make deploy        (or: docker compose up -d --build)
#
# Network exposure: only the `app` container is published (default 127.0.0.1:33460),
# meant to sit behind a TLS-terminating proxy (Cloudflare + Traefik/Pangolin).
# Caddy in `app` serves the SPA and proxies /api/* to `api`. The API, worker and
# data stores are reachable only on the internal compose network, except for
# loopback-only dev ports on postgres/redis/qdrant.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Environment shared by api and worker.
# The worker imports the API env schema, so it needs the full set.
x-app-env: &app-env
  NODE_ENV: production
  PORT: "33450"
  HOST: 0.0.0.0
  API_V1_PREFIX: /api/v1
  APP_URL: ${APP_URL:?Set APP_URL in .env (public origin, e.g. https://ai.example.com)}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 48)}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env (min 12 chars)}
  DB_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
  SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
  QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-documents}

x-hardened: &hardened
  init: true
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Loopback only (local dev tooling, psql over SSH). Never published externally.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data in /var/lib/postgresql/18/docker (PGDATA);
      # mount the parent so the named volume really holds the data.
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # One-shot: applies packages/db/drizzle migrations, then exits.
  migrate:
    <<: *hardened
    restart: "no"
    image: foxmayn-ai-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *hardened
    image: foxmayn-ai-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      <<: *app-env
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  worker:
    <<: *hardened
    image: foxmayn-ai-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    # Lets active jobs finish (worker force-exits at 100s).
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      <<: *app-env
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  # Caddy: serves the SPA, proxies /api/* to api. The only published service.
  app:
    <<: *hardened
    image: foxmayn-ai-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND:-127.0.0.1}:${APP_PORT:-33460}:33460"
    # Caddy's binary carries the net_bind_service file capability; with
    # no-new-privileges that capability must be in the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    # Read-only rootfs: Caddy still wants writable /config and /data (unused with TLS off).
    volumes:
      - type: tmpfs
        target: /config
        tmpfs:
          mode: 1777
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 1777
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Job payloads hold document text: persist (AOF), never evict, fail writes
    # with an OOM error instead of being OOM-killed.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction --maxmemory 256mb
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

  qdrant:
    # -unprivileged runs as uid 1000 instead of root
    image: qdrant/qdrant:v1.20.0-unprivileged
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network
    healthcheck:
      # /readyz does not require the API key
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
